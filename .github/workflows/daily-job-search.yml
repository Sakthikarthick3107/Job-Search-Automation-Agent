name: Daily Job Search

on:
  schedule:
    # Run every hour (will activate after first successful run)
    - cron: '0 * * * *'

  # Manual trigger - click "Run workflow" in Actions tab
  workflow_dispatch:

  # Auto-run on every push to keep schedules active
  push:
    branches:
      - main

# Prevent overlapping runs from racing on data/seen-jobs.json
concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  run-job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run LinkedIn Job Search
        run: node src/index.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          JOB_SEARCHES: ${{ vars.JOB_SEARCHES }}
          RESUME_URL: ${{ vars.RESUME_URL }}

      # Persist the "already reported" job list so the next run only
      # reports genuinely new jobs. [skip ci] prevents this push from
      # re-triggering the workflow.
      - name: Commit job state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-jobs.json
          if git diff --cached --quiet; then
            echo "No new jobs to save, state unchanged"
          else
            git commit -m "chore: update job dedupe state [skip ci]"
            git push
          fi