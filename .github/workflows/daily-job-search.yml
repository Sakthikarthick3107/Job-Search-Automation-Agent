name: Daily Job Search

on:
  schedule:
    # Run every hour (will activate after first successful run)
    - cron: '0 * * * *'

  # Manual trigger - click "Run workflow" in Actions tab
  workflow_dispatch:

  # Auto-run on every push to keep schedules active
  push:
    branches:
      - main

jobs:
  run-job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run LinkedIn Job Search
        run: node src/index.js
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          JOB_SEARCHES: ${{ vars.JOB_SEARCHES }}
          RESUME_URL: ${{ vars.RESUME_URL }}